<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ULTRA ANALYST V16 | Dixon-Coles & Form Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --red: #e8001d; --bg: #080810; --surface: #11111c; --border: rgba(255,255,255,0.08); --text: #eeeef8; --muted: #6868a0; --green: #00ff88; }
        body { font-family: 'Outfit'; background: var(--bg); color: var(--text); padding: 20px; }
        .wrap { max-width: 1200px; margin: auto; }
        header { text-align: center; padding: 30px; border-bottom: 2px solid var(--red); margin-bottom: 30px; }
        h1 { font-family: 'Bebas Neue'; font-size: 55px; letter-spacing: 5px; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px; border-top: 4px solid var(--red); }
        .vs { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; }
        .team { flex: 1; text-align: center; font-weight: 700; font-size: 16px; }
        .main-score { font-family: 'Bebas Neue'; font-size: 50px; color: var(--text); line-height: 1; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px; }
        .stat-box { background: rgba(0,0,0,0.2); padding: 8px; border-radius: 10px; text-align: center; }
        .stat-box small { display: block; font-size: 10px; color: var(--muted); margin-bottom: 3px; }
        .stat-box b { color: var(--green); font-size: 16px; }
        .form-indicator { font-size: 10px; color: #aaa; margin-top: 5px; }
        .tag { font-size: 9px; padding: 3px 6px; background: #222; border-radius: 4px; color: #00d2ff; }
    </style>
</head>
<body>

<div class="wrap">
    <header>
        <h1>ULTRA ANALYST V16</h1>
        <p style="color:var(--muted)">Poisson + Dixon-Coles Correction • xG/xGA Form Decay Model</p>
    </header>
    <div id="grid" class="grid"></div>
</div>

<script>
/** * FORM KATSAYISI: 1.0 = Standart, 1.15 = Çok Formda, 0.85 = Formsuz
 * att: xG Üretme Kapasitesi | def: xGA (Yeme) Direnci
 */
const TEAMS = {
    "Galatasaray": { elo: 1860, att: 2.50, def: 0.80, form: 1.15, mv: 295 },
    "Fenerbahçe": { elo: 1845, att: 2.35, def: 0.85, form: 1.10, mv: 265 },
    "Beşiktaş": { elo: 1735, att: 1.85, def: 1.15, form: 1.05, mv: 145 },
    "Trabzonspor": { elo: 1755, att: 1.75, def: 1.10, form: 0.95, mv: 115 },
    "Başakşehir FK": { elo: 1690, att: 1.65, def: 1.25, form: 1.00, mv: 60 },
    "Göztepe": { elo: 1685, att: 1.55, def: 1.05, form: 1.08, mv: 42 },
    "Samsunspor": { elo: 1615, att: 1.40, def: 1.20, form: 1.02, mv: 32 },
    "Kocaelispor": { elo: 1575, att: 1.35, def: 1.35, form: 0.98, mv: 30 },
    "Eyüpspor": { elo: 1520, att: 1.25, def: 1.40, form: 0.90, mv: 35 },
    "Konyaspor": { elo: 1515, att: 1.15, def: 1.55, form: 0.95, mv: 24 },
    "Antalyaspor": { elo: 1530, att: 1.20, def: 1.60, form: 0.88, mv: 26 },
    "Çaykur Rizespor": { elo: 1550, att: 1.35, def: 1.70, form: 0.92, mv: 25 },
    "Kasımpaşa": { elo: 1510, att: 1.45, def: 1.75, form: 1.00, mv: 31 },
    "Alanyaspor": { elo: 1540, att: 1.25, def: 1.50, form: 0.93, mv: 27 },
    "Gaziantep FK": { elo: 1560, att: 1.30, def: 1.80, form: 1.01, mv: 22 },
    "Kayserispor": { elo: 1490, att: 1.10, def: 1.85, form: 0.85, mv: 19 },
    "Gençlerbirliği": { elo: 1545, att: 1.20, def: 1.45, form: 1.04, mv: 28 },
    "Fatih Karagümrük": { elo: 1480, att: 1.15, def: 1.90, form: 0.90, mv: 20 }
};

const FIXTURES = [
    { h: "Galatasaray", a: "Başakşehir FK", weather: 1.0, pitch: 1.0, ref: 1.05, hAbs: 1, aAbs: 0 },
    { h: "Fatih Karagümrük", a: "Fenerbahçe", weather: 1.0, pitch: 1.0, ref: 1.10, hAbs: 0, aAbs: 1 },
    { h: "Trabzonspor", a: "Çaykur Rizespor", weather: 0.9, pitch: 0.85, ref: 1.0, hAbs: 2, aAbs: 1 },
    { h: "Göztepe", a: "Alanyaspor", weather: 1.0, pitch: 1.0, ref: 1.05, hAbs: 0, aAbs: 0 },
    { h: "Gençlerbirliği", a: "Beşiktaş", weather: 1.0, pitch: 1.0, ref: 1.0, hAbs: 1, aAbs: 2 },
    { h: "Samsunspor", a: "Kayserispor", weather: 1.0, pitch: 0.9, ref: 1.0, hAbs: 0, aAbs: 1 }
];

function factorial(n) { return n <= 1 ? 1 : n * factorial(n - 1); }
function poisson(k, lambda) { return (Math.pow(lambda, k) * Math.exp(-lambda)) / factorial(k); }

// DIXON-COLES DÜZELTME PARAMETRESİ (RHO)
function getDixonColesCorr(h, a, hLambda, aLambda, rho = -0.15) {
    if (h === 0 && a === 0) return 1 - (hLambda * aLambda * rho);
    if (h === 0 && a === 1) return 1 + (hLambda * rho);
    if (h === 1 && a === 0) return 1 + (aLambda * rho);
    if (h === 1 && a === 1) return 1 - rho;
    return 1;
}

function run() {
    const grid = document.getElementById("grid");
    FIXTURES.forEach(m => {
        const H = TEAMS[m.h]; const A = TEAMS[m.a];
        
        // FORM VE DIŞ FAKTÖR ETKİSİYLE xG HESAPLAMA
        // xG = (Saldırı Gücü * Rakip Savunma * Form Çarpanı * Hava/Zemin)
        let hXG = (H.att * A.def * H.form * m.weather * m.pitch) * (1 + (H.elo - A.elo)/500) + 0.25;
        let aXG = (A.att * H.def * A.form * m.weather * m.pitch) * (1 - (H.elo - A.elo)/500);

        hXG = Math.max(0.1, hXG - (m.hAbs * 0.15));
        aXG = Math.max(0.1, aXG - (m.aAbs * 0.15));

        let matrix = [], pW = 0, pD = 0, pL = 0, o25 = 0, btts = 0, maxP = 0, bestS = "0-0";

        for (let i = 0; i < 6; i++) {
            for (let j = 0; j < 6; j++) {
                let prob = poisson(i, hXG) * poisson(j, aXG) * getDixonColesCorr(i, j, hXG, aXG);
                if (i > j) pW += prob; else if (i === j) pD += prob; else pL += prob;
                if (i + j > 2.5) o25 += prob;
                if (i > 0 && j > 0) btts += prob;
                if (prob > maxP) { maxP = prob; bestS = i + "-" + j; }
            }
        }

        grid.innerHTML += `
            <div class="card">
                <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                    <span class="tag">FORM: ${(H.form*100).toFixed(0)}% vs ${(A.form*100).toFixed(0)}%</span>
                    <span class="tag" style="color:var(--green)">Dixon-Coles Active</span>
                </div>
                <div class="vs">
                    <div class="team">${m.h}</div>
                    <div class="main-score">${bestS}</div>
                    <div class="team">${m.a}</div>
                </div>
                <div class="stats">
                    <div class="stat-item" style="grid-column: span 2; text-align:center; font-size:12px; margin-bottom:5px;">
                        Taraf: EV %${(pW*100).toFixed(0)} | BER %${(pD*100).toFixed(0)} | DEP %${(pL*100).toFixed(0)}
                    </div>
                    <div class="stat-box"><small>KG VAR</small><b>%${(btts*100).toFixed(0)}</b></div>
                    <div class="stat-box"><small>2.5 ÜST</small><b>%${(o25*100).toFixed(0)}</b></div>
                    <div class="stat-box"><small>GÜNCEL xG</small><b>${hXG.toFixed(1)}-${aXG.toFixed(1)}</b></div>
                    <div class="stat-box"><small>GÜVEN</small><b>%${(maxP*220).toFixed(0)}</b></div>
                </div>
            </div>
        `;
    });
}
run();
</script>
</body>
</html>
