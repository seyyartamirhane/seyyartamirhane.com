<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>PRO ELITE V10 · Monte Carlo + Dixon Coles + İlk Yarı</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
--red:#e8001d;
--bg:#080810;
--surface:#11111c;
--border:rgba(255,255,255,0.08);
--text:#eeeef8;
--muted:#6868a0;
--blue:#4fc3f7;
}
body{font-family:'Outfit';background:var(--bg);color:var(--text);padding:20px;}
.wrap{max-width:1200px;margin:auto;}
header{text-align:center;padding:40px;border-bottom:1px solid var(--border);margin-bottom:30px;}
h1{font-family:'Bebas Neue';font-size:60px;letter-spacing:6px;color:var(--red);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:25px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:25px;border-top:4px solid var(--red);}
.vs{display:flex;justify-content:space-between;align-items:center;margin:15px 0;}
.team{flex:1;text-align:center;font-weight:700;}
.score{font-family:'Bebas Neue';font-size:50px;}
.iy{font-size:13px;color:var(--red);}
.bar{height:6px;background:#000;display:flex;border-radius:10px;overflow:hidden;margin-top:10px;}
.h{background:var(--red)}
.d{background:#666}
.a{background:var(--blue)}
.details{margin-top:15px;font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>PRO ELITE V10</h1>
<p style="color:#777">Monte Carlo · Dixon-Coles · Poisson Model · İlk Yarı</p>
</header>
<div id="grid" class="grid"></div>
</div>

<script>
const SIMS=10000

const TEAMS={
"Galatasaray":{elo:1845,attack:2.1,def:0.9,htsr:0.42},
"Fenerbahçe":{elo:1815,attack:2.0,def:1.0,htsr:0.45},
"Trabzonspor":{elo:1755,attack:1.7,def:1.2,htsr:0.38},
"Beşiktaş":{elo:1730,attack:1.6,def:1.2,htsr:0.40},
"Göztepe":{elo:1680,attack:1.4,def:1.0,htsr:0.35},
"Başakşehir FK":{elo:1695,attack:1.6,def:1.1,htsr:0.41},
"Samsunspor":{elo:1600,attack:1.2,def:1.3,htsr:0.33},
"Kocaelispor":{elo:1575,attack:1.1,def:1.2,htsr:0.36},
"Alanyaspor":{elo:1545,attack:1.2,def:1.4,htsr:0.34},
"Antalyaspor":{elo:1525,attack:1.1,def:1.5,htsr:0.31},
"Çaykur Rizespor":{elo:1555,attack:1.3,def:1.5,htsr:0.36},
"Gaziantep FK":{elo:1565,attack:1.3,def:1.6,htsr:0.32},
"Eyüpspor":{elo:1515,attack:1.0,def:1.4,htsr:0.30},
"Gençlerbirliği":{elo:1535,attack:1.2,def:1.4,htsr:0.35},
"Konyaspor":{elo:1515,attack:1.2,def:1.5,htsr:0.29},
"Kasımpaşa":{elo:1505,attack:1.1,def:1.5,htsr:0.33},
"Kayserispor":{elo:1495,attack:1.0,def:1.7,htsr:0.28},
"Fatih Karagümrük":{elo:1475,attack:1.1,def:1.8,htsr:0.27}
}

const FIXTURES=[
{h:"Antalyaspor",a:"Gaziantep FK"},
{h:"Fatih Karagümrük",a:"Fenerbahçe"},
{h:"Kocaelispor",a:"Konyaspor"},
{h:"Trabzonspor",a:"Çaykur Rizespor"},
{h:"Göztepe",a:"Alanyaspor"},
{h:"Galatasaray",a:"Başakşehir FK"},
{h:"Kasımpaşa",a:"Eyüpspor"},
{h:"Gençlerbirliği",a:"Beşiktaş"},
{h:"Samsunspor",a:"Kayserispor"}
]

function poisson(lambda){
let L=Math.exp(-lambda)
let k=0
let p=1
do{k++;p*=Math.random()}while(p>L)
return k-1
}

function dixonColesAdjust(h,a){
if(h==0 && a==0) return 1.1
if(h==0 && a==1) return 1.05
if(h==1 && a==0) return 1.05
if(h==1 && a==1) return 1.08
return 1
}

function monteCarlo(hXG,aXG){
let hw=0,dr=0,aw=0
let htScore="0-0",ftScore="0-0"
let scoreMap={},htMap={}

for(let i=0;i<SIMS;i++){
let h=poisson(hXG), a=poisson(aXG)
let adj=dixonColesAdjust(h,a)
if(Math.random()>adj) continue
scoreMap[h+"-"+a]=(scoreMap[h+"-"+a]||0)+1
if(h>a)hw++
else if(h<a)aw++
else dr++

// İlk yarı skor
let hHT=poisson(hXG*0.5), aHT=poisson(aXG*0.5)
htMap[hHT+"-"+aHT]=(htMap[hHT+"-"+aHT]||0)+1
}

// En olası skoru bul
let max=0; for(let k in scoreMap){if(scoreMap[k]>max){max=scoreMap[k]; ftScore=k}}
max=0; for(let k in htMap){if(htMap[k]>max){max=htMap[k]; htScore=k}}

return{score:ftScore,home:hw/SIMS,draw:dr/SIMS,away:aw/SIMS,ht:htScore}
}

function calcXG(H,A){
let elo=(H.elo-A.elo)/400
let hXG=(H.attack*A.def)*(1+elo*0.15)
let aXG=(A.attack*H.def)*(1-elo*0.15)
return[hXG,aXG]
}

function run(){
let grid=document.getElementById("grid")
FIXTURES.forEach(m=>{
let H=TEAMS[m.h], A=TEAMS[m.a]
let xg=calcXG(H,A)
let sim=monteCarlo(xg[0],xg[1])
let card=document.createElement("div")
card.className="card"
card.innerHTML=`
<div>${m.h} vs ${m.a}</div>
<div class="vs">
<div class="team">${m.h}</div>
<div>
<div class="score">${sim.score}</div>
<div class="iy">İY: ${sim.ht}</div>
</div>
<div class="team">${m.a}</div>
</div>
<div class="bar">
<div class="h" style="width:${sim.home*100}%"></div>
<div class="d" style="width:${sim.draw*100}%"></div>
<div class="a" style="width:${sim.away*100}%"></div>
</div>
<div class="details">
EV %${(sim.home*100).toFixed(1)} |
X %${(sim.draw*100).toFixed(1)} |
DEP %${(sim.away*100).toFixed(1)}<br>
xG ${xg[0].toFixed(2)} - ${xg[1].toFixed(2)}
</div>
`
grid.appendChild(card)
})
}

run()
</script>
</body>
</html>
