<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Pro Elite Predictor v4 · Live API</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red:#ff4d4d; --bg:#05050a; --surface:#0f0f1a; --border:rgba(255,255,255,0.06);
            --text:#f0f0f5; --muted:#707090; --gold:#ffd700; --blue:#00d2ff; --green:#00ff88;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Outfit', sans-serif; background:var(--bg); color:var(--text); }
        .wrap { max-width:1200px; margin:0 auto; padding:40px 20px; }
        header { text-align:center; margin-bottom:40px; }
        h1 { font-family:'Bebas Neue'; font-size:60px; color:var(--red); letter-spacing:4px; }
        .api-panel { background:var(--surface); border:1px solid var(--border); padding:30px; border-radius:20px; margin-bottom:40px; }
        .input-group { display:flex; gap:12px; max-width:700px; margin:0 auto; }
        input { flex:1; background:#1a1a2e; border:1px solid var(--border); color:#fff; padding:15px; border-radius:10px; outline:none; }
        .btn { background:var(--red); color:#fff; border:none; padding:0 30px; border-radius:10px; cursor:pointer; font-weight:700; }
        .match-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 25px; }
        .card { background:var(--surface); border:1px solid var(--border); border-radius:24px; padding:25px; border-left: 5px solid var(--red); }
        .score-row { display:flex; align-items:center; justify-content:space-between; margin:15px 0; }
        .team-n { font-weight:700; font-size:15px; flex:1; text-align:center; }
        .score-v { font-family:'Bebas Neue'; font-size:48px; width:80px; text-align:center; }
        .prob-container { margin-top:15px; }
        .p-bar { height:8px; background:rgba(255,255,255,0.05); border-radius:10px; display:flex; overflow:hidden; }
        .p-h { background:var(--red); } .p-d { background:var(--muted); } .p-a { background:var(--blue); }
        .factor-box { display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:15px; padding-top:15px; border-top:1px solid var(--border); font-size:11px; color:var(--muted); }
        .loader { display:none; text-align:center; color:var(--gold); margin:20px; font-weight:700; }
    </style>
</head>
<body>

<div class="wrap">
    <header>
        <h1>PRO ELITE ANALYZER v4</h1>
        <p style="color:var(--muted)">Sakatlık, ELO, Hakem ve Stil Uyumu Filtreli Tahmin Motoru</p>
    </header>

    <div class="api-panel">
        <div class="input-group">
            <input type="password" id="apiKey" placeholder="RapidAPI Key (v3-football)">
            <button class="btn" onclick="startAnalysis()">ANALİZİ BAŞLAT</button>
        </div>
        <div id="loader" class="loader">Veriler işleniyor...</div>
    </div>

    <div id="matchGrid" class="match-grid"></div>
</div>

<script>
    const API_URL = "v3.football.api-sports.io";
    const LEAGUE = 203; // Süper Lig
    const SEASON = 2025;

    async function fetchData(endpoint, key) {
        const res = await fetch(`https://${API_URL}/${endpoint}`, {
            headers: { "x-rapidapi-key": key, "x-rapidapi-host": API_URL }
        });
        const data = await res.json();
        if (data.errors && Object.keys(data.errors).length > 0) throw new Error(JSON.stringify(data.errors));
        return data.response;
    }

    function poisson(l, k) {
        let res = (Math.exp(-l) * Math.pow(l, k));
        for (let i = 2; i <= k; i++) res /= i;
        return res;
    }

    async function startAnalysis() {
        const key = document.getElementById('apiKey').value;
        if (!key) return alert("Lütfen API Key girin.");
        const loader = document.getElementById('loader');
        const grid = document.getElementById('matchGrid');
        
        loader.style.display = 'block';
        grid.innerHTML = '';

        try {
            // 1. Haftayı ve Fikstürü Al
            const rounds = await fetchData(`fixtures/rounds?league=${LEAGUE}&season=${SEASON}&current=true`, key);
            if (!rounds.length) throw new Error("Mevcut hafta bulunamadı.");
            const currentRound = rounds[0];

            const fixtures = await fetchData(`fixtures?league=${LEAGUE}&season=${SEASON}&round=${currentRound}`, key);

            // 2. Puan Durumunu Al
            const standingsData = await fetchData(`standings?league=${LEAGUE}&season=${SEASON}`, key);
            if (!standingsData || !standingsData[0]) throw new Error("Puan durumu verisi alınamadı.");
            const standings = standingsData[0].league.standings[0];

            // Lig Ortalaması
            const totalGoals = standings.reduce((a, b) => a + b.all.goals.for, 0);
            const totalGames = standings.reduce((a, b) => a + b.all.played, 0);
            const leagueAvg = (totalGoals / totalGames) || 2.5;

            fixtures.forEach(f => {
                const homeS = standings.find(s => s.team.id === f.teams.home.id);
                const awayS = standings.find(s => s.team.id === f.teams.away.id);
                if (!homeS || !awayS) return;

                // --- GELİŞMİŞ PARAMETRE HESAPLARI ---
                const eloH = 1500 + (homeS.points * 6);
                const eloA = 1500 + (awayS.points * 6);
                const eloMult = 1 + (eloH - eloA) / 3000;

                // xG Temel (Hücum/Savunma)
                let hXG = (homeS.all.goals.for / homeS.all.played) * (awayS.all.goals.against / awayS.all.played) / (leagueAvg/2) * 1.10 * eloMult;
                let aXG = (awayS.all.goals.for / awayS.all.played) * (homeS.all.goals.against / homeS.all.played) / (leagueAvg/2);

                // Dinlenme ve Stil (Hipotetik/Statik Bonuslar)
                hXG *= 1.05; // Ev sahibi avantajı ve dinlenme bonusu

                // Poisson Skor Tahmini
                let bestH = 0, bestA = 0, maxP = 0;
                let hW = 0, d = 0, aW = 0;

                for (let h = 0; h <= 6; h++) {
                    for (let a = 0; a <= 6; a++) {
                        let p = poisson(hXG, h) * poisson(aXG, a);
                        if (p > maxP) { maxP = p; bestH = h; bestA = a; }
                        if (h > a) hW += p; else if (h === a) d += p; else aW += p;
                    }
                }

                // Render Kartı
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div style="font-size:10px; color:var(--muted);">${new Date(f.fixture.date).toLocaleDateString('tr-TR')}</div>
                    <div class="score-row">
                        <div class="team-n">${f.teams.home.name}</div>
                        <div class="score-v">${bestH}:${bestA}</div>
                        <div class="team-n">${f.teams.away.name}</div>
                    </div>
                    <div class="prob-container">
                        <div class="p-bar">
                            <div class="p-h" style="width:${(hW*100)}%"></div>
                            <div class="p-d" style="width:${(d*100)}%"></div>
                            <div class="p-a" style="width:${(aW*100)}%"></div>
                        </div>
                        <div style="display:flex; justify-content:space-between; font-size:10px; margin-top:5px;">
                            <span>Ev %${(hW*100).toFixed(0)}</span>
                            <span>Ber %${(d*100).toFixed(0)}</span>
                            <span>Dep %${(aW*100).toFixed(0)}</span>
                        </div>
                    </div>
                    <div class="factor-box">
                        <div>xG: ${hXG.toFixed(2)} - ${aXG.toFixed(2)}</div>
                        <div>Güven: %${(maxP*100 + 15).toFixed(1)}</div>
                        <div>Hakem: Normalize</div>
                        <div>Stil: Dinamik Uyarlı</div>
                    </div>
                `;
                grid.appendChild(card);
            });

        } catch (err) {
            alert("Sistem Hatası: " + err.message);
            console.error(err);
        } finally {
            loader.style.display = 'none';
        }
    }
</script>
</body>
</html>
