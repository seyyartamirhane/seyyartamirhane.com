<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRA ANALYST V16 | Professional Prediction Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #ff3e3e; --bg: #05050a; --surface: #0f0f1a;
            --border: rgba(255,255,255,0.08); --text: #f0f0f5;
            --muted: #8888b0; --green: #00ff88; --orange: #ff9f43; --blue: #00d2ff;
        }

        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: auto; }
        
        header { 
            text-align: center; padding: 40px 0; border-bottom: 3px solid var(--red); 
            background: linear-gradient(to bottom, #111122, var(--bg)); margin-bottom: 40px;
        }
        h1 { font-family: 'Bebas Neue'; font-size: 60px; margin: 0; letter-spacing: 6px; color: #fff; }
        .sub { color: var(--green); font-weight: 700; letter-spacing: 2px; font-size: 14px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 25px; }
        
        .card { 
            background: var(--surface); border: 1px solid var(--border); border-radius: 28px; 
            padding: 25px; position: relative; border-top: 5px solid #333; transition: 0.3s;
        }
        .card.value-found { border-top-color: var(--green); box-shadow: 0 10px 30px rgba(0,255,136,0.1); }
        
        .signal { 
            position: absolute; top: 20px; right: 20px; font-size: 10px; font-weight: 800; 
            padding: 5px 12px; border-radius: 10px; text-transform: uppercase; 
        }
        .signal.green { background: var(--green); color: #000; }
        .signal.none { background: #222; color: #777; }

        .vs-area { display: flex; justify-content: space-between; align-items: center; margin: 25px 0; }
        .team-box { flex: 1; text-align: center; }
        .team-name { font-weight: 700; font-size: 18px; color: #fff; margin-bottom: 5px; }
        .form-dots { display: flex; justify-content: center; gap: 4px; font-size: 9px; color: var(--muted); }

        .score-box { text-align: center; min-width: 1200px; flex: 1.5; }
        .main-score { font-family: 'Bebas Neue'; font-size: 64px; line-height: 1; color: var(--text); }
        .iy-info { font-size: 13px; color: var(--red); font-weight: 600; margin-top: 5px; }

        .odds-table { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; 
            margin: 20px 0; padding: 15px 0; border-top: 1px solid var(--border);
        }
        .odd-item { background: rgba(0,0,0,0.4); padding: 10px; border-radius: 12px; text-align: center; border: 1px solid #222; }
        .odd-item small { display: block; font-size: 9px; color: var(--muted); margin-bottom: 3px; }
        .odd-item b { color: var(--blue); font-size: 16px; }
        .odd-item.best { border-color: var(--green); background: rgba(0,255,136,0.05); }

        .analysis-footer { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .stat { background: rgba(255,255,255,0.02); padding: 12px; border-radius: 15px; text-align: center; border: 1px solid var(--border); }
        .stat span { display: block; font-size: 10px; color: var(--muted); margin-bottom: 4px; }
        .stat b { font-size: 18px; font-family: 'Bebas Neue'; color: var(--green); }

        .chaos-meter { 
            margin-top: 15px; height: 4px; background: #111; border-radius: 2px; overflow: hidden; position: relative;
        }
        .chaos-fill { height: 100%; background: var(--orange); box-shadow: 0 0 10px var(--orange); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ULTRA ANALYST V16</h1>
        <div class="sub">POISSON • DIXON-COLES • CHAOS ENTROPY • VALUE HUNTER</div>
    </header>

    <div id="app" class="grid"></div>
</div>

<script>
/**
 * 26. HAFTA GÜNCEL PUAN DURUMU & FORM VERİLERİ (MAÇKOLİK SENKRON)
 * att: Hücum Gücü (xG) | def: Savunma Direnci (xGA)
 * form: Son 5 Maç (1.0 = Nötr) | mot: Motivasyon/Kaos Direnci
 */
const TEAMS = {
    "Galatasaray": { att: 2.75, def: 0.70, form: 1.18, mot: 1.10, elo: 1870 },
    "Fenerbahçe": { att: 2.40, def: 0.85, form: 0.88, mot: 1.15, elo: 1835 },
    "Trabzonspor": { att: 2.10, def: 1.05, form: 1.12, mot: 1.20, elo: 1765 },
    "Beşiktaş": { att: 1.90, def: 1.10, form: 1.05, mot: 1.05, elo: 1740 },
    "Göztepe": { att: 1.65, def: 1.00, form: 1.10, mot: 1.10, elo: 1700 },
    "Başakşehir": { att: 1.70, def: 1.25, form: 1.02, mot: 1.00, elo: 1710 },
    "Samsunspor": { att: 1.50, def: 1.30, form: 1.05, mot: 1.05, elo: 1625 },
    "Kayserispor": { att: 1.10, def: 1.85, form: 0.85, mot: 1.30, elo: 1490 }, // Düşme hattı can havli
    "Kasımpaşa": { att: 1.45, def: 1.70, form: 0.95, mot: 1.10, elo: 1515 },
    "Eyüpspor": { att: 1.20, def: 1.55, form: 0.90, mot: 1.15, elo: 1520 },
    "Gençlerbirliği": { att: 1.25, def: 1.45, form: 1.05, mot: 1.05, elo: 1555 },
    "Alanyaspor": { att: 1.20, def: 1.60, form: 0.92, mot: 1.00, elo: 1540 },
    "Ç. Rizespor": { att: 1.35, def: 1.75, form: 0.90, mot: 1.10, elo: 1560 }
};

/**
 * 26. HAFTA KALAN MAÇLAR & İDDAA ORANLARI
 * [MS1, MSX, MS2]
 */
const FIXTURES = [
    { h: "Galatasaray", a: "Başakşehir", odds: [1.40, 4.25, 5.60], chaos: 0.12 },
    { h: "Trabzonspor", a: "Ç. Rizespor", odds: [1.62, 3.75, 4.10], chaos: 0.38 }, // Bölge derbisi kaosu
    { h: "Göztepe", a: "Alanyaspor", odds: [1.85, 3.40, 3.20], chaos: 0.15 },
    { h: "Samsunspor", a: "Kayserispor", odds: [2.05, 3.15, 2.90], chaos: 0.32 }, // Kritik düşme hattı kaosu
    { h: "Kasımpaşa", a: "Eyüpspor", odds: [2.30, 3.30, 2.50], chaos: 0.20 },
    { h: "Gençlerbirliği", a: "Beşiktaş", odds: [4.60, 3.85, 1.48], chaos: 0.18 }
];

function factorial(n) { return n <= 1 ? 1 : n * factorial(n - 1); }
function poisson(k, lambda) { return (Math.pow(lambda, k) * Math.exp(-lambda)) / factorial(k); }

// Dixon-Coles Düşük Skor Korelasyonu
function dixonColes(h, a, hL, aL, rho = -0.14) {
    if (h === 0 && a === 0) return 1 - (hL * aL * rho);
    if (h === 0 && a === 1) return 1 + (hL * rho);
    if (h === 1 && a === 0) return 1 + (aL * rho);
    if (h === 1 && a === 1) return 1 - rho;
    return 1;
}

function run() {
    const app = document.getElementById("app");
    
    FIXTURES.forEach(match => {
        const H = TEAMS[match.h]; const A = TEAMS[match.a];
        
        // Gelişmiş xG Hesaplama (Form ve Kaos Entegre)
        let hXG = (H.att * A.def * H.form * H.mot) * (1 + (H.elo - A.elo)/500) + 0.28;
        let aXG = (A.att * H.def * A.form * A.mot) * (1 - (H.elo - A.elo)/500);
        hXG = Math.max(0.1, hXG); aXG = Math.max(0.1, aXG);

        let pW = 0, pD = 0, pL = 0, btts = 0, o25 = 0, maxP = 0, score = "0-0";
        
        for (let i = 0; i < 7; i++) {
            for (let j = 0; j < 7; j++) {
                let prob = poisson(i, hXG) * poisson(j, aXG) * dixonColes(i, j, hXG, aXG);
                if (i > j) pW += prob; else if (i === j) pD += prob; else pL += prob;
                if (i + j > 2.5) o25 += prob;
                if (i > 0 && j > 0) btts += prob;
                if (prob > maxP) { maxP = prob; score = i + "-" + j; }
            }
        }

        // Value Hunter Algoritması (%5 Marj)
        const vW = pW > (1/match.odds[0] + 0.05);
        const vD = pD > (1/match.odds[1] + 0.05);
        const vL = pL > (1/match.odds[2] + 0.05);
        const hasValue = vW || vD || vL;

        const card = document.createElement("div");
        card.className = `card ${hasValue ? 'value-found' : ''}`;
        card.innerHTML = `
            <div class="signal ${hasValue ? 'green' : 'none'}">${hasValue ? 'DEĞERLİ ORAN' : 'ANALİZ SABİT'}</div>
            
            <div class="vs-area">
                <div class="team-box"><div class="team-name">${match.h}</div><div class="form-dots">ELO: ${H.elo}</div></div>
                <div class="score-box">
                    <div class="main-score">${score}</div>
                    <div class="iy-info">İY TAHMİN: ${Math.floor(hXG*0.4)}-${Math.floor(aXG*0.4)}</div>
                </div>
                <div class="team-box"><div class="team-name">${match.a}</div><div class="form-dots">ELO: ${A.elo}</div></div>
            </div>

            <div class="odds-table">
                <div class="odd-item ${vW ? 'best' : ''}"><small>MS 1</small><b>${match.odds[0].toFixed(2)}</b></div>
                <div class="odd-item ${vD ? 'best' : ''}"><small>MS X</small><b>${match.odds[1].toFixed(2)}</b></div>
                <div class="odd-item ${vL ? 'best' : ''}"><small>MS 2</small><b>${match.odds[2].toFixed(2)}</b></div>
            </div>

            <div class="analysis-footer">
                <div class="stat"><span>KG VAR</span><b>%${(btts*100).toFixed(0)}</b></div>
                <div class="stat"><span>2.5 ÜST</span><b>%${(o25*100).toFixed(0)}</b></div>
                <div class="stat"><span>BEKLENEN GOL (xG)</span><b>${hXG.toFixed(2)} - ${aXG.toFixed(2)}</b></div>
                <div class="stat"><span>GÜVEN ENDEKSİ</span><b>%${(maxP*230).toFixed(0)}</b></div>
            </div>

            <div style="margin-top:15px; font-size:10px; color:var(--orange); font-weight:700;">KAOS FAKTÖRÜ: %${(match.chaos*100).toFixed(0)}</div>
            <div class="chaos-meter"><div class="chaos-fill" style="width:${match.chaos*100}%"></div></div>
        `;
        app.appendChild(card);
    });
}
run();
</script>
</body>
</html>
