<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>PRO ELITE V9 · Monte Carlo + Dixon Coles</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
--red:#e8001d;
--gold:#f5c842;
--bg:#080810;
--surface:#11111c;
--border:rgba(255,255,255,0.08);
--text:#eeeef8;
--muted:#6868a0;
--blue:#4fc3f7;
}

body{
font-family:'Outfit';
background:var(--bg);
color:var(--text);
padding:20px;
}

.wrap{
max-width:1200px;
margin:auto;
}

header{
text-align:center;
padding:40px;
border-bottom:1px solid var(--border);
margin-bottom:30px;
}

h1{
font-family:'Bebas Neue';
font-size:60px;
letter-spacing:6px;
color:var(--red);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
gap:25px;
}

.card{
background:var(--surface);
border:1px solid var(--border);
border-radius:20px;
padding:25px;
border-top:4px solid var(--red);
}

.vs{
display:flex;
justify-content:space-between;
align-items:center;
margin:15px 0;
}

.team{
flex:1;
text-align:center;
font-weight:700;
}

.score{
font-family:'Bebas Neue';
font-size:50px;
}

.iy{
font-size:13px;
color:var(--red);
}

.bar{
height:6px;
background:#000;
display:flex;
border-radius:10px;
overflow:hidden;
margin-top:10px;
}

.h{background:var(--red)}
.d{background:#666}
.a{background:var(--blue)}

.details{
margin-top:15px;
font-size:12px;
color:var(--muted);
}
</style>
</head>

<body>

<div class="wrap">

<header>
<h1>PRO ELITE V9</h1>
<p style="color:#777">Monte Carlo · Dixon-Coles · Poisson Model</p>
</header>

<div id="grid" class="grid"></div>

</div>

<script>

const SIMS = 10000

const TEAMS = {

Galatasaray:{
elo:1845,
homeGS:38,
homeGC:12,
awayGS:24,
awayGC:14,
shots:16,
shotsOT:6.5,
bigChances:3.2,
cleanSheets:12,
last5points:12,
missingValue:15,
starting11:220,
rest:6,
position:1
},

Fenerbahçe:{
elo:1820,
homeGS:36,
homeGC:14,
awayGS:26,
awayGC:16,
shots:15,
shotsOT:6.2,
bigChances:3.0,
cleanSheets:11,
last5points:10,
missingValue:20,
starting11:210,
rest:6,
position:2
},

Trabzonspor:{
elo:1750,
homeGS:30,
homeGC:16,
awayGS:22,
awayGC:18,
shots:13,
shotsOT:5,
bigChances:2.2,
cleanSheets:8,
last5points:8,
missingValue:18,
starting11:150,
rest:6,
position:4
},

Beşiktaş:{
elo:1730,
homeGS:28,
homeGC:17,
awayGS:21,
awayGC:19,
shots:12,
shotsOT:4.8,
bigChances:2.1,
cleanSheets:7,
last5points:7,
missingValue:22,
starting11:145,
rest:7,
position:5
}

}

const FIXTURES=[
{h:"Galatasaray",a:"Fenerbahçe"},
{h:"Trabzonspor",a:"Beşiktaş"}
]

function poisson(lambda){

let L=Math.exp(-lambda)
let k=0
let p=1

do{
k++
p*=Math.random()
}
while(p>L)

return k-1
}

function dixonColesAdjust(h,a,lambda,mu){

if(h==0 && a==0) return 1.1
if(h==0 && a==1) return 1.05
if(h==1 && a==0) return 1.05
if(h==1 && a==1) return 1.08

return 1
}

function calculateXG(H,A){

let eloDiff=(H.elo-A.elo)/1000

let hAttack=H.homeGS/19
let aDef=A.awayGC/19

let aAttack=A.awayGS/19
let hDef=H.homeGC/19

let hXG=hAttack*aDef
let aXG=aAttack*hDef

hXG*=1+eloDiff*0.6
aXG*=1-eloDiff*0.6

let hForm=H.last5points/15
let aForm=A.last5points/15

hXG*=0.9+hForm*0.3
aXG*=0.9+aForm*0.3

let hShot=H.shotsOT/H.shots
let aShot=A.shotsOT/A.shots

hXG*=0.8+hShot
aXG*=0.8+aShot

hXG*=1+(H.bigChances*0.04)
aXG*=1+(A.bigChances*0.04)

hXG*=1-(A.cleanSheets/30)*0.4
aXG*=1-(H.cleanSheets/30)*0.4

let hMissing=H.missingValue/H.starting11
let aMissing=A.missingValue/A.starting11

hXG*=1-hMissing*0.6
aXG*=1-aMissing*0.6

hXG*=1+((H.rest-5)*0.03)
aXG*=1+((A.rest-5)*0.03)

let hMot=(18-H.position)*0.015
let aMot=(18-A.position)*0.015

hXG*=1+hMot
aXG*=1+aMot

return[hXG,aXG]

}

function monteCarlo(hXG,aXG){

let hw=0
let dr=0
let aw=0

let scoreMap={}

for(let i=0;i<SIMS;i++){

let h=poisson(hXG)
let a=poisson(aXG)

let adj=dixonColesAdjust(h,a,hXG,aXG)

if(Math.random()>adj) continue

let key=h+"-"+a
scoreMap[key]=(scoreMap[key]||0)+1

if(h>a)hw++
else if(h<a)aw++
else dr++

}

let bestScore="0-0"
let max=0

for(let k in scoreMap){
if(scoreMap[k]>max){
max=scoreMap[k]
bestScore=k
}
}

return{
score:bestScore,
home:hw/SIMS,
draw:dr/SIMS,
away:aw/SIMS
}

}

function run(){

let grid=document.getElementById("grid")

FIXTURES.forEach(m=>{

let H=TEAMS[m.h]
let A=TEAMS[m.a]

let xg=calculateXG(H,A)

let sim=monteCarlo(xg[0],xg[1])

let card=document.createElement("div")
card.className="card"

card.innerHTML=`

<div>${m.h} vs ${m.a}</div>

<div class="vs">

<div class="team">${m.h}</div>

<div>

<div class="score">${sim.score}</div>

</div>

<div class="team">${m.a}</div>

</div>

<div class="bar">

<div class="h" style="width:${sim.home*100}%"></div>
<div class="d" style="width:${sim.draw*100}%"></div>
<div class="a" style="width:${sim.away*100}%"></div>

</div>

<div class="details">

EV %${(sim.home*100).toFixed(1)} |
X %${(sim.draw*100).toFixed(1)} |
DEP %${(sim.away*100).toFixed(1)}

<br>

xG ${xg[0].toFixed(2)} - ${xg[1].toFixed(2)}

</div>

`

grid.appendChild(card)

})

}

run()

</script>

</body>
</html>
