<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>PRO ELITE V15</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

:root{
--red:#e8001d;
--bg:#080810;
--surface:#11111c;
--border:rgba(255,255,255,0.08);
--text:#eeeef8;
--muted:#6868a0;
--blue:#4fc3f7;
}

body{
font-family:'Outfit';
background:var(--bg);
color:var(--text);
padding:20px;
}

.wrap{
max-width:1200px;
margin:auto;
}

header{
text-align:center;
padding:40px;
border-bottom:1px solid var(--border);
margin-bottom:30px;
}

h1{
font-family:'Bebas Neue';
font-size:60px;
letter-spacing:6px;
color:var(--red);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
gap:25px;
}

.card{
background:var(--surface);
border:1px solid var(--border);
border-radius:20px;
padding:25px;
border-top:4px solid var(--red);
}

.vs{
display:flex;
justify-content:space-between;
align-items:center;
margin:15px 0;
}

.team{
flex:1;
text-align:center;
font-weight:700;
}

.score{
font-family:'Bebas Neue';
font-size:48px;
}

.iy{
font-size:13px;
color:var(--red);
}

.bar{
height:6px;
background:#000;
display:flex;
border-radius:10px;
overflow:hidden;
margin-top:10px;
}

.h{background:var(--red)}
.d{background:#666}
.a{background:var(--blue)}

.details{
margin-top:15px;
font-size:12px;
color:var(--muted);
line-height:1.6;
}

</style>
</head>

<body>

<div class="wrap">

<header>
<h1>PRO ELITE V15</h1>
<p style="color:#777">Poisson · Dixon-Coles · xG Model</p>
</header>

<div id="grid" class="grid"></div>

</div>

<script>

const HOME_ADV = 0.25

const TEAMS={

"Galatasaray":{elo:1845,attack:2.1,def:0.9},
"Fenerbahçe":{elo:1815,attack:2.0,def:1.0},
"Trabzonspor":{elo:1755,attack:1.7,def:1.2},
"Beşiktaş":{elo:1730,attack:1.6,def:1.2},
"Göztepe":{elo:1680,attack:1.4,def:1.0},
"Başakşehir FK":{elo:1695,attack:1.6,def:1.1},
"Samsunspor":{elo:1600,attack:1.2,def:1.3},
"Kocaelispor":{elo:1575,attack:1.1,def:1.2},
"Alanyaspor":{elo:1545,attack:1.2,def:1.4},
"Antalyaspor":{elo:1525,attack:1.1,def:1.5},
"Çaykur Rizespor":{elo:1555,attack:1.3,def:1.5},
"Gaziantep FK":{elo:1565,attack:1.3,def:1.6},
"Eyüpspor":{elo:1515,attack:1.0,def:1.4},
"Gençlerbirliği":{elo:1535,attack:1.2,def:1.4},
"Konyaspor":{elo:1515,attack:1.2,def:1.5},
"Kasımpaşa":{elo:1505,attack:1.1,def:1.5},
"Kayserispor":{elo:1495,attack:1.0,def:1.7},
"Fatih Karagümrük":{elo:1475,attack:1.1,def:1.8}

}

const FIXTURES=[

{h:"Antalyaspor",a:"Gaziantep FK"},
{h:"Fatih Karagümrük",a:"Fenerbahçe"},
{h:"Kocaelispor",a:"Konyaspor"},
{h:"Trabzonspor",a:"Çaykur Rizespor"},
{h:"Göztepe",a:"Alanyaspor"},
{h:"Galatasaray",a:"Başakşehir FK"},
{h:"Kasımpaşa",a:"Eyüpspor"},
{h:"Gençlerbirliği",a:"Beşiktaş"},
{h:"Samsunspor",a:"Kayserispor"}

]


function factorial(n){
if(n==0) return 1
return n*factorial(n-1)
}


function poisson(k,lambda){
return (Math.pow(lambda,k)*Math.exp(-lambda))/factorial(k)
}


function calcXG(H,A){

let elo=(H.elo-A.elo)/400

let hXG=(H.attack*A.def)*(1+elo*0.2)+HOME_ADV
let aXG=(A.attack*H.def)*(1-elo*0.2)

return [hXG,aXG]

}


function matrix(lambdaH,lambdaA){

let matrix=[]
for(let h=0;h<=5;h++){

matrix[h]=[]

for(let a=0;a<=5;a++){

let p=poisson(h,lambdaH)*poisson(a,lambdaA)

matrix[h][a]=p

}

}

return matrix

}


function probabilities(m){

let home=0
let draw=0
let away=0

for(let h=0;h<=5;h++){

for(let a=0;a<=5;a++){

let p=m[h][a]

if(h>a) home+=p
else if(h==a) draw+=p
else away+=p

}

}

return [home,draw,away]

}


function bestScore(m){

let best=0
let score="0-0"

for(let h=0;h<=5;h++){

for(let a=0;a<=5;a++){

if(m[h][a]>best){

best=m[h][a]
score=h+"-"+a

}

}

}

return score

}


function btts(m){

let p=0

for(let h=1;h<=5;h++){
for(let a=1;a<=5;a++){

p+=m[h][a]

}
}

return p

}


function over25(m){

let p=0

for(let h=0;h<=5;h++){
for(let a=0;a<=5;a++){

if(h+a>=3) p+=m[h][a]

}
}

return p

}



function run(){

let grid=document.getElementById("grid")

FIXTURES.forEach(m=>{

let H=TEAMS[m.h]
let A=TEAMS[m.a]

let xg=calcXG(H,A)

let mat=matrix(xg[0],xg[1])

let probs=probabilities(mat)

let score=bestScore(mat)

let htH=Math.round(xg[0]*0.45)
let htA=Math.round(xg[1]*0.45)

let bttsP=btts(mat)
let overP=over25(mat)

let card=document.createElement("div")

card.className="card"

card.innerHTML=`

<div>${m.h} vs ${m.a}</div>

<div class="vs">

<div class="team">${m.h}</div>

<div>

<div class="score">${score}</div>
<div class="iy">İY: ${htH}-${htA}</div>

</div>

<div class="team">${m.a}</div>

</div>

<div class="bar">

<div class="h" style="width:${(probs[0]*100).toFixed(1)}%"></div>
<div class="d" style="width:${(probs[1]*100).toFixed(1)}%"></div>
<div class="a" style="width:${(probs[2]*100).toFixed(1)}%"></div>

</div>

<div class="details">

EV %${(probs[0]*100).toFixed(1)} |
X %${(probs[1]*100).toFixed(1)} |
DEP %${(probs[2]*100).toFixed(1)} <br>

BTTS %${(bttsP*100).toFixed(1)} |
OVER2.5 %${(overP*100).toFixed(1)} <br>

xG ${xg[0].toFixed(2)} - ${xg[1].toFixed(2)}

</div>

`

grid.appendChild(card)

})

}

run()

</script>

</body>
</html>
