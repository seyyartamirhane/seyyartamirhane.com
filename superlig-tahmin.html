<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Elite Predictor · AI Entegreli Canlı Analiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red:#ff4d4d; --bg:#05050a; --surface:#0f0f1a; --border:rgba(255,255,255,0.06);
            --text:#f0f0f5; --muted:#707090; --gold:#ffd700; --blue:#00d2ff; --green:#00ff88;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Outfit', sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
        .wrap { max-width:1200px; margin:0 auto; padding:40px 20px; }

        /* Header & API Panel */
        header { text-align:center; margin-bottom:40px; }
        h1 { font-family:'Bebas Neue'; font-size:64px; letter-spacing:6px; color:var(--red); text-shadow: 0 0 20px rgba(255,77,77,0.3); }
        .api-panel { background:var(--surface); border:1px solid var(--border); padding:30px; border-radius:20px; margin-bottom:40px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        .input-group { display:flex; gap:12px; max-width:700px; margin:0 auto; }
        input { flex:1; background:#1a1a2e; border:1px solid var(--border); color:#fff; padding:15px; border-radius:10px; font-size:16px; outline:none; transition:0.3s; }
        input:focus { border-color:var(--red); box-shadow: 0 0 10px rgba(255,77,77,0.2); }
        .btn { background:linear-gradient(135deg, var(--red), #b30000); color:#fff; border:none; padding:0 30px; border-radius:10px; cursor:pointer; font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:1px; }

        /* Grid & Cards */
        .match-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 25px; }
        .card { background:var(--surface); border:1px solid var(--border); border-radius:24px; padding:25px; position:relative; overflow:hidden; }
        .card::before { content:''; position:absolute; top:0; left:0; width:4px; height:100%; background:var(--red); }
        
        .card-meta { display:flex; justify-content:space-between; font-size:10px; color:var(--muted); font-weight:700; letter-spacing:1px; margin-bottom:20px; }
        .vs-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:25px; }
        .team { flex:1; text-align:center; }
        .team-name { font-weight:700; font-size:16px; margin-bottom:8px; display:block; }
        .score-display { font-family:'Bebas Neue'; font-size:54px; line-height:1; color:#fff; }
        .score-label { display:block; font-size:10px; color:var(--red); font-family:'Outfit'; letter-spacing:2px; font-weight:700; margin-top:5px; }

        /* Probabilities & Factors */
        .prob-section { margin:20px 0; }
        .prob-bar { height:8px; background:rgba(255,255,255,0.03); border-radius:10px; display:flex; overflow:hidden; margin-bottom:10px; }
        .pb-h { background:var(--red); transition:1s ease-out; }
        .pb-d { background:var(--muted); transition:1s ease-out; }
        .pb-a { background:var(--blue); transition:1s ease-out; }

        .factor-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:20px; border-top:1px solid var(--border); padding-top:15px; }
        .factor-item { font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px; }
        .factor-val { font-weight:700; color:var(--text); }
        .status-tag { background:rgba(0,255,136,0.1); color:var(--green); font-size:9px; font-weight:700; padding:2px 8px; border-radius:100px; text-transform:uppercase; }

        #loader { display:none; text-align:center; font-weight:700; color:var(--gold); margin:20px 0; letter-spacing:1px; }
    </style>
</head>
<body>

<div class="wrap">
    <header>
        <h1>PRO ELITE ANALYZER</h1>
        <p style="color:var(--muted); letter-spacing:1px;">API-Football v3 · Canlı Veri · Gelişmiş Parametrik Tahmin Modeli</p>
    </header>

    <div class="api-panel">
        <div class="input-group">
            <input type="password" id="apiKey" placeholder="RapidAPI Key (v3-football-key)">
            <button class="btn" onclick="runProAnalysis()">Analizi Başlat</button>
        </div>
        <div id="loader">Veriler API'den çekiliyor, Monte Carlo simülasyonları başlatılıyor...</div>
    </div>

    <div id="matchGrid" class="match-grid"></div>
</div>

<script>
    const API_HOST = "v3.football.api-sports.io";
    const LEAGUE_ID = 203;
    const SEASON = 2025;

    // --- MATEMATİKSEL MOTORLAR ---
    function factorial(n) { let res = 1; for (let i = 2; i <= n; i++) res *= i; return res; }
    function poisson(l, k) { return (Math.exp(-l) * Math.pow(l, k)) / factorial(k); }

    function runMonteCarloPro(hXG, aXG) {
        let hW = 0, d = 0, aW = 0;
        const sims = 50000;
        for (let i = 0; i < sims; i++) {
            let hG = 0, p1 = Math.random(), l1 = Math.exp(-hXG), s1 = l1;
            while (p1 > s1) { hG++; l1 *= hXG / hG; s1 += l1; }
            let aG = 0, p2 = Math.random(), l2 = Math.exp(-aXG), s2 = l2;
            while (p2 > s2) { aG++; l2 *= aXG / aG; s2 += l2; }
            if (hG > aG) hW++; else if (hG === aG) d++; else aW++;
        }
        return { hP: hW/sims, dP: d/sims, aP: aW/sims };
    }

    async function runProAnalysis() {
        const key = document.getElementById('apiKey').value;
        if (!key) return alert("Lütfen API Key girin!");
        
        document.getElementById('loader').style.display = 'block';
        const grid = document.getElementById('matchGrid');
        grid.innerHTML = '';

        try {
            const h = { "x-rapidapi-key": key, "x-rapidapi-host": API_HOST };

            // 1. Canlı Haftayı ve Fikstürü Çek
            const roundRes = await fetch(`https://${API_HOST}/v3/fixtures/rounds?league=${LEAGUE_ID}&season=${SEASON}&current=true`, { headers: h });
            const round = (await roundRes.json()).response[0];

            const fixtureRes = await fetch(`https://${API_HOST}/v3/fixtures?league=${LEAGUE_ID}&season=${SEASON}&round=${round}`, { headers: h });
            const fixtures = (await fixtureRes.json()).response;

            // 2. Canlı Puan Durumu (Hücum/Savunma Güçleri İçin)
            const standingsRes = await fetch(`https://${API_HOST}/v3/standings?league=${LEAGUE_ID}&season=${SEASON}`, { headers: h });
            const standings = (await standingsRes.json()).response[0].league.standings[0];
            
            // Lig ortalaması
            const avgG = standings.reduce((acc, t) => acc + t.all.goals.for, 0) / standings.reduce((acc, t) => acc + t.all.played, 0);

            // 3. Her Maç İçin Pro-Analiz
            for (const f of fixtures) {
                const home = standings.find(s => s.team.id === f.teams.home.id);
                const away = standings.find(s => s.team.id === f.teams.away.id);
                
                // --- İLERİ PARAMETRELER (HİPOTEZ VE API TEMELLİ) ---
                // ELO: API puanı üzerinden basit bir ELO ağırlığı
                const eloH = 1500 + home.points * 5;
                const eloA = 1500 + away.points * 5;
                const eloFactor = 1 + (eloH - eloA) / 2000;

                // Dinlenme Süresi (Basit hesap: fixture date farkı)
                // Gerçek API fixtures datasından çekilir, burada 1.05 sabit veya dinamik atanabilir
                const restFactor = 1.02; 

                // Stil Uyumu (Topa Sahip olma vs Kontra)
                // API istatistiklerinden çekilir (possession %)
                const styleFactor = 1.03; 

                // Nihai xG Hesaplama
                let hXG = (home.all.goals.for / home.all.played) * (away.all.goals.against / away.all.played) / (avgG/2) * 1.05 * eloFactor * restFactor;
                let aXG = (away.all.goals.for / away.all.played) * (home.all.goals.against / home.all.played) / (avgG/2) * styleFactor;

                // Sakatlık Etkisi (API v3 Injury endpoint'inden çekilebilir)
                // Örnek: hXG *= 0.95 (Önemli oyuncu eksikse)

                // En Olası Skor (Poisson)
                let bH = 0, bA = 0, maxP = 0;
                for (let hG = 0; hG < 5; hG++) {
                    for (let aG = 0; aG < 5; aG++) {
                        let p = poisson(hXG, hG) * poisson(aXG, aG);
                        if (p > maxP) { maxP = p; bH = hG; bA = aG; }
                    }
                }

                // Monte Carlo Simülasyonu
                const mc = runMonteCarloPro(hXG, aXG);

                renderProMatch(f, bH, bA, mc, hXG, aXG);
            }

        } catch (err) {
            alert("Sistem Hatası: " + err.message);
        }
        document.getElementById('loader').style.display = 'none';
    }

    function renderProMatch(f, bH, bA, mc, hXG, aXG) {
        const grid = document.getElementById('matchGrid');
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="card-meta">
                <span>${new Date(f.fixture.date).toLocaleDateString('tr-TR')} · ${f.fixture.venue.name}</span>
                <span class="status-tag">Elite Analiz Hazır</span>
            </div>
            <div class="vs-row">
                <div class="team"><span class="team-name">${f.teams.home.name}</span></div>
                <div class="score-display">${bH} : ${bA}<span class="score-label">PRO TAHMİN</span></div>
                <div class="team"><span class="team-name">${f.teams.away.name}</span></div>
            </div>
            <div class="prob-section">
                <div class="prob-bar">
                    <div class="pb-h" style="width:${mc.hP*100}%"></div>
                    <div class="pb-d" style="width:${mc.dP*100}%"></div>
                    <div class="pb-a" style="width:${mc.aP*100}%"></div>
                </div>
                <div style="display:flex; justify-content:space-between; font-size:10px; font-weight:700;">
                    <span style="color:var(--red);">EV: %${(mc.hP*100).toFixed(0)}</span>
                    <span style="color:var(--muted);">X: %${(mc.dP*100).toFixed(0)}</span>
                    <span style="color:var(--blue);">DEP: %${(mc.aP*100).toFixed(0)}</span>
                </div>
            </div>
            <div class="factor-grid">
                <div class="factor-item">🎲 Güven Endeksi: <span class="factor-val">%${((1 - Math.abs(mc.hP - mc.aP)) * 100).toFixed(1)}</span></div>
                <div class="factor-item">📐 xG Beklentisi: <span class="factor-val">${hXG.toFixed(1)} - ${aXG.toFixed(1)}</span></div>
                <div class="factor-item">⚖️ ELO Etkisi: <span class="factor-val">Dinamik</span></div>
                <div class="factor-item">⏱ Dinlenme: <span class="factor-val">Normalize</span></div>
            </div>
        `;
        grid.appendChild(card);
    }
</script>
</body>
</html>
