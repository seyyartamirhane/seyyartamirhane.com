<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ULTRA ANALYST V16 | 26. Hafta (HT & FT Tam Liste)</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --red: #ff3e3e; --bg: #05050a; --surface: #0f0f1a; --border: rgba(255,255,255,0.1); --text: #ffffff; --muted: #a0a0c0; --green: #00ff88; --accent: #00d2ff; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .wrap { max-width: 1400px; margin: auto; }
        header { text-align: center; padding: 30px; border-bottom: 3px solid var(--red); margin-bottom: 30px; background: rgba(255,255,255,0.02); border-radius: 0 0 20px 20px; }
        h1 { font-family: 'Bebas Neue'; font-size: 60px; letter-spacing: 4px; margin: 0; color: #fff; text-shadow: 0 0 20px rgba(255,62,62,0.4); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 25px; }
        
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 20px; border-top: 5px solid var(--red); position: relative; overflow: hidden; }
        .card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, rgba(255,62,62,0.05) 0%, transparent 100%); pointer-events: none; }

        .match-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .tag { font-size: 10px; padding: 4px 10px; background: #1a1a2e; border-radius: 6px; color: var(--accent); font-weight: 700; text-transform: uppercase; border: 1px solid rgba(0,210,255,0.2); }

        .vs-container { display: flex; align-items: center; justify-content: space-between; margin: 20px 0; gap: 10px; }
        .team-box { flex: 1; text-align: center; }
        .team-name { font-family: 'Bebas Neue'; font-size: 22px; color: #fff; display: block; margin-bottom: 5px; letter-spacing: 1px; }
        .win-prob { font-size: 12px; color: var(--muted); font-weight: 400; }

        .score-box { text-align: center; min-width: 120px; }
        .ft-score { font-family: 'Bebas Neue'; font-size: 52px; line-height: 1; color: var(--green); text-shadow: 0 0 15px rgba(0,255,136,0.3); }
        .ht-score { font-family: 'Outfit'; font-size: 16px; font-weight: 700; color: var(--red); margin-top: 5px; background: rgba(255,62,62,0.1); padding: 2px 8px; border-radius: 4px; display: inline-block; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; border-top: 1px solid var(--border); padding-top: 20px; }
        .stat-item { background: rgba(255,255,255,0.03); padding: 12px 5px; border-radius: 12px; text-align: center; border: 1px solid transparent; transition: 0.3s; }
        .stat-item:hover { border-color: var(--red); background: rgba(255,255,255,0.05); }
        .stat-item small { display: block; font-size: 10px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; }
        .stat-item b { font-family: 'Bebas Neue'; font-size: 20px; color: #fff; }

        .xg-footer { grid-column: span 3; margin-top: 10px; font-size: 11px; color: var(--muted); text-align: center; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="wrap">
    <header>
        <h1>ULTRA ANALYST V16</h1>
        <p style="color:var(--red); font-weight:700; letter-spacing: 2px;">26. HAFTA | İLK YARI & MAÇ SONU ANALİZ PANELİ</p>
    </header>
    <div id="grid" class="grid"></div>
</div>

<script>
const TEAMS = {
    "Galatasaray": { elo: 1865, att: 2.65, def: 0.75, form: 1.15 },
    "Fenerbahçe": { elo: 1850, att: 2.45, def: 0.85, form: 1.12 },
    "Beşiktaş": { elo: 1745, att: 1.95, def: 1.10, form: 1.05 },
    "Trabzonspor": { elo: 1755, att: 1.80, def: 1.15, form: 0.95 },
    "Başakşehir FK": { elo: 1700, att: 1.65, def: 1.20, form: 1.02 },
    "Göztepe": { elo: 1690, att: 1.60, def: 1.05, form: 1.10 },
    "Samsunspor": { elo: 1620, att: 1.45, def: 1.25, form: 1.05 },
    "Kocaelispor": { elo: 1585, att: 1.40, def: 1.30, form: 1.00 },
    "Eyüpspor": { elo: 1530, att: 1.30, def: 1.40, form: 0.92 },
    "Gençlerbirliği": { elo: 1555, att: 1.25, def: 1.45, form: 1.04 },
    "Alanyaspor": { elo: 1545, att: 1.25, def: 1.55, form: 0.93 },
    "Antalyaspor": { elo: 1535, att: 1.20, def: 1.65, form: 0.88 },
    "Kasımpaşa": { elo: 1515, att: 1.50, def: 1.75, form: 1.02 },
    "Çaykur Rizespor": { elo: 1560, att: 1.35, def: 1.65, form: 0.90 },
    "Gaziantep FK": { elo: 1570, att: 1.30, def: 1.80, form: 1.00 },
    "Kayserispor": { elo: 1500, att: 1.05, def: 1.90, form: 0.82 },
    "Konyaspor": { elo: 1525, att: 1.20, def: 1.50, form: 0.96 },
    "Fatih Karagümrük": { elo: 1490, att: 1.15, def: 1.85, form: 0.92 }
};

const FIXTURES = [
    { h: "Galatasaray", a: "Başakşehir FK", weather: 1.0, pitch: 1.0, hAbs: 1, aAbs: 0 },
    { h: "Fatih Karagümrük", a: "Fenerbahçe", weather: 1.0, pitch: 1.0, hAbs: 0, aAbs: 2 },
    { h: "Trabzonspor", a: "Çaykur Rizespor", weather: 0.9, pitch: 0.85, hAbs: 2, aAbs: 1 },
    { h: "Gençlerbirliği", a: "Beşiktaş", weather: 1.0, pitch: 1.0, hAbs: 1, aAbs: 2 },
    { h: "Göztepe", a: "Alanyaspor", weather: 1.0, pitch: 1.0, hAbs: 0, aAbs: 0 },
    { h: "Samsunspor", a: "Kayserispor", weather: 1.0, pitch: 0.9, hAbs: 0, aAbs: 1 },
    { h: "Kocaelispor", a: "Konyaspor", weather: 1.0, pitch: 1.0, hAbs: 1, aAbs: 0 },
    { h: "Antalyaspor", a: "Gaziantep FK", weather: 1.0, pitch: 1.0, hAbs: 2, aAbs: 1 },
    { h: "Kasımpaşa", a: "Eyüpspor", weather: 1.0, pitch: 1.0, hAbs: 1, aAbs: 1 }
];

function fact(n) { return n <= 1 ? 1 : n * fact(n - 1); }
function pois(k, l) { return (Math.pow(l, k) * Math.exp(-l)) / fact(k); }

function run() {
    const grid = document.getElementById("grid");
    FIXTURES.forEach(m => {
        const H = TEAMS[m.h]; const A = TEAMS[m.a];
        
        // FT xG Hesaplama
        let hXG = (H.att * A.def * H.form * m.weather * m.pitch) * (1 + (H.elo - A.elo)/500) + 0.28;
        let aXG = (A.att * H.def * A.form * m.weather * m.pitch) * (1 - (H.elo - A.elo)/500);
        hXG = Math.max(0.1, hXG - (m.hAbs * 0.15));
        aXG = Math.max(0.1, aXG - (m.aAbs * 0.15));

        // HT xG (Maçın %46'sı genelde ilk yarıda biter)
        let hHTxG = hXG * 0.46;
        let aHTxG = aXG * 0.46;

        let pW=0, pD=0, pL=0, o25=0, btts=0, maxP=0, bestS="0-0";
        let htMaxP=0, bestHTS="0-0";

        // Simülasyon
        for (let i = 0; i < 7; i++) {
            for (let j = 0; j < 7; j++) {
                // FT Olasılık
                let prob = pois(i, hXG) * pois(j, aXG);
                if (i > j) pW += prob; else if (i === j) pD += prob; else pL += prob;
                if (i + j > 2.5) o25 += prob;
                if (i > 0 && j > 0) btts += prob;
                if (prob > maxP) { maxP = prob; bestS = i + "-" + j; }

                // HT Olasılık
                let htProb = pois(i, hHTxG) * pois(j, aHTxG);
                if (htProb > htMaxP) { htMaxP = htProb; bestHTS = i + "-" + j; }
            }
        }

        grid.innerHTML += `
            <div class="card">
                <div class="match-header">
                    <span class="tag">GÜÇ: ${(H.elo/20).toFixed(0)} vs ${(A.elo/20).toFixed(0)}</span>
                    <span class="tag" style="color:var(--green)">FORM: %${(H.form*100).toFixed(0)}</span>
                </div>

                <div class="vs-container">
                    <div class="team-box">
                        <span class="team-name">${m.h}</span>
                        <span class="win-prob">EV: %${(pW*100).toFixed(0)}</span>
                    </div>
                    
                    <div class="score-box">
                        <div class="ft-score">${bestS}</div>
                        <div class="ht-score">İY: ${bestHTS}</div>
                    </div>

                    <div class="team-box">
                        <span class="team-name">${m.a}</span>
                        <span class="win-prob">DEP: %${(pL*100).toFixed(0)}</span>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-item"><small>KG VAR</small><b>%${(btts*100).toFixed(0)}</b></div>
                    <div class="stat-item"><small>2.5 ÜST</small><b>%${(o25*100).toFixed(0)}</b></div>
                    <div class="stat-item"><small>BERABERE</small><b>%${(pD*100).toFixed(0)}</b></div>
                    
                    <div class="xg-footer">
                        BEKLENEN GOL (xG)<br>
                        <b>İY: ${hHTxG.toFixed(2)} - ${aHTxG.toFixed(2)}</b> | 
                        <b>MS: ${hXG.toFixed(2)} - ${aXG.toFixed(2)}</b>
                    </div>
                </div>
            </div>
        `;
    });
}
run();
</script>
</body>
</html>
