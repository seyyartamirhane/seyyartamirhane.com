<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ULTRA ANALYST V18 | Realistic Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --red: #ff3e3e; --bg: #05050a; --surface: #0f0f1a; --border: rgba(255,255,255,0.08); --text: #f0f0f5; --green: #00ff88; --muted: #6c6c8c; }
        body { font-family: 'Outfit'; background: var(--bg); color: var(--text); padding: 15px; margin: 0; }
        .container { max-width: 1200px; margin: auto; }
        header { text-align: center; padding: 25px 0; border-bottom: 2px solid var(--red); background: #0d0d1a; margin-bottom: 25px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 18px; border-top: 4px solid #333; }
        .vs { display: flex; align-items: center; justify-content: space-between; margin: 15px 0; }
        .team { flex: 1; text-align: center; font-weight: 700; font-size: 15px; }
        .score-box { text-align: center; flex: 1; }
        .main-score { font-family: 'Bebas Neue'; font-size: 52px; color: #fff; line-height: 1; }
        .iy { font-size: 12px; color: var(--red); font-weight: 700; }
        .absents { font-size: 10px; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 8px; margin: 10px 0; border: 1px solid #222; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
        .stat-item { background: rgba(255,255,255,0.02); padding: 10px; border-radius: 10px; text-align: center; border: 1px solid var(--border); }
        .stat-item span { display: block; font-size: 9px; color: var(--muted); }
        .stat-item b { font-size: 16px; font-family: 'Bebas Neue'; color: var(--green); }
    </style>
</head>
<body>
<div class="container">
    <header><h1>ULTRA ANALYST V18</h1><div style="color:var(--green); font-size:11px; font-weight:700;">REALISTIC SCORE ALGORITHM • 26. HAFTA</div></header>
    <div id="app" class="grid"></div>
</div>

<script>
// LİG GERÇEKLERİNE GÖRE TÖRPÜLENMİŞ VERİLER
const TEAMS = {
    "Galatasaray": { att: 2.15, def: 0.85, form: 1.10, mot: 1.05, elo: 1870, poss: 62, eff: 1.1, luck: -0.1 },
    "Fenerbahçe": { att: 2.05, def: 0.90, form: 0.88, mot: 1.10, elo: 1835, poss: 58, eff: 0.9, luck: 0.1 },
    "Trabzonspor": { att: 1.70, def: 1.10, form: 1.10, mot: 1.15, elo: 1765, poss: 54, eff: 1.0, luck: 0.0 },
    "Beşiktaş": { att: 1.65, def: 1.15, form: 1.05, mot: 1.00, elo: 1740, poss: 55, eff: 1.0, luck: -0.1 },
    "Göztepe": { att: 1.45, def: 1.10, form: 1.08, mot: 1.05, elo: 1700, poss: 48, eff: 1.1, luck: 0.1 },
    "Başakşehir": { att: 1.50, def: 1.25, form: 1.02, mot: 1.00, elo: 1710, poss: 52, eff: 1.0, luck: -0.05 },
    "Samsunspor": { att: 1.35, def: 1.35, form: 1.05, mot: 1.05, elo: 1625, poss: 46, eff: 1.0, luck: 0.1 },
    "Kayserispor": { att: 1.05, def: 1.70, form: 0.85, mot: 1.30, elo: 1490, poss: 44, eff: 0.8, luck: -0.2 },
    "Kasımpaşa": { att: 1.35, def: 1.65, form: 0.95, mot: 1.10, elo: 1515, poss: 47, eff: 1.1, luck: 0.1 },
    "Eyüpspor": { att: 1.20, def: 1.55, form: 0.92, mot: 1.15, elo: 1520, poss: 45, eff: 1.0, luck: 0.0 },
    "Gençlerbirliği": { att: 1.15, def: 1.45, form: 1.02, mot: 1.05, elo: 1555, poss: 49, eff: 0.9, luck: -0.1 },
    "Alanyaspor": { att: 1.15, def: 1.55, form: 0.92, mot: 1.00, elo: 1540, poss: 51, eff: 0.9, luck: 0.1 },
    "Ç. Rizespor": { att: 1.25, def: 1.65, form: 0.90, mot: 1.10, elo: 1560, poss: 47, eff: 1.0, luck: -0.05 },
    "Antalyaspor": { att: 1.15, def: 1.65, form: 0.85, mot: 1.00, elo: 1530, poss: 49, eff: 0.9, luck: -0.1 },
    "Gaziantep FK": { att: 1.25, def: 1.65, form: 1.10, mot: 1.15, elo: 1570, poss: 45, eff: 1.1, luck: 0.1 },
    "Kocaelispor": { att: 1.25, def: 1.35, form: 0.95, mot: 1.00, elo: 1580, poss: 50, eff: 1.0, luck: 0.0 },
    "Konyaspor": { att: 1.15, def: 1.50, form: 1.05, mot: 1.15, elo: 1530, poss: 48, eff: 1.1, luck: 0.1 },
    "Karagümrük": { att: 1.10, def: 1.75, form: 1.20, mot: 1.30, elo: 1500, poss: 46, eff: 1.1, luck: 0.1 }
};

const FIXTURES = [
    { h: "Galatasaray", a: "Başakşehir", odds: [1.42, 4.10, 5.40], hAbs: "Muslera", aAbs: "Yok" },
    { h: "Trabzonspor", a: "Ç. Rizespor", odds: [1.65, 3.60, 3.90], hAbs: "Visca", aAbs: "Shelvey" },
    { h: "Göztepe", a: "Alanyaspor", odds: [1.90, 3.25, 3.10], hAbs: "Yok", aAbs: "Yok" },
    { h: "Samsunspor", a: "Kayserispor", odds: [2.10, 3.10, 2.85], hAbs: "Yok", aAbs: "Yok" },
    { h: "Kasımpaşa", a: "Eyüpspor", odds: [2.25, 3.20, 2.55], hAbs: "Yok", hAbs: "Yok" },
    { h: "Gençlerbirliği", a: "Beşiktaş", odds: [4.80, 3.90, 1.45], hAbs: "Yok", aAbs: "Gedson" },
    { h: "Antalyaspor", a: "Gaziantep FK", odds: [2.05, 3.15, 2.95], hAbs: "Yok", aAbs: "Yok" },
    { h: "Kocaelispor", a: "Konyaspor", odds: [2.40, 3.10, 2.60], hAbs: "Yok", aAbs: "Yok" },
    { h: "Karagümrük", a: "Fenerbahçe", odds: [5.20, 4.10, 1.40], hAbs: "Yok", aAbs: "Fred" }
];

function fact(n) { return n <= 1 ? 1 : n * fact(n-1); }
function pois(k, l) { return (Math.pow(l, k) * Math.exp(-l)) / fact(k); }

function run() {
    const app = document.getElementById("app");
    FIXTURES.forEach(m => {
        const H = TEAMS[m.h]; const A = TEAMS[m.a];
        
        // REEL xG HESABI (Baskılanmış)
        let hXG = (H.att * A.def * H.form * H.mot * (H.poss/55)) * (1 + (H.elo - A.elo)/600) + 0.15;
        let aXG = (A.att * H.def * A.form * A.mot * (A.poss/55)) * (1 - (H.elo - A.elo)/600);
        
        if(m.hAbs !== "Yok") hXG *= 0.9; if(m.aAbs !== "Yok") aXG *= 0.9;

        let pW = 0, pD = 0, pL = 0, btts = 0, o25 = 0, maxP = 0, score = "0-0";
        for (let i = 0; i < 6; i++) {
            for (let j = 0; j < 6; j++) {
                let prob = pois(i, hXG) * pois(j, aXG);
                // Dixon-Coles (Düşük Skor Düzeltmesi - Sertleştirilmiş)
                if (i < 2 && j < 2) prob *= 1.18; 
                
                if (i > j) pW += prob; else if (i === j) pD += prob; else pL += prob;
                if (i + j > 2.5) o25 += prob;
                if (i > 0 && j > 0) btts += prob;
                if (prob > maxP) { maxP = prob; score = i + "-" + j; }
            }
        }

        app.innerHTML += `
            <div class="card">
                <div class="vs">
                    <div class="team">${m.h}</div>
                    <div class="score-box"><span class="main-score">${score}</span><span class="iy">İY: ${Math.floor(hXG*0.35)}-${Math.floor(aXG*0.35)}</span></div>
                    <div class="team">${m.a}</div>
                </div>
                <div class="absents"><b>Eksikler:</b> ${m.h}: ${m.hAbs} | ${m.a}: ${m.aAbs}</div>
                <div class="stats-grid">
                    <div class="stat-item"><span>EV KAZANIR</span><b>%${(pW*100).toFixed(0)}</b></div>
                    <div class="stat-item"><span>KG VAR</span><b>%${(btts*100).toFixed(0)}</b></div>
                    <div class="stat-item"><span>2.5 ÜST</span><b>%${(o25*100).toFixed(0)}</b></div>
                    <div class="stat-item"><span>xG GÜCÜ</span><b>${hXG.toFixed(1)}-${aXG.toFixed(1)}</b></div>
                </div>
            </div>`;
    });
}
run();
</script>
</body>
</html>
