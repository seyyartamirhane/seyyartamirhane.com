<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ULTRA ANALYST V19 | Statistical Efficiency Model</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #ff3e3e; --bg: #030308; --surface: #0a0a14;
            --border: rgba(255,255,255,0.06); --text: #f0f0f5;
            --muted: #6c6c8c; --green: #00ff88; --orange: #ff9f43; --blue: #00d2ff;
        }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; }
        .container { max-width: 1400px; margin: auto; }
        header { text-align: center; padding: 25px 0; border-bottom: 3px solid var(--red); background: #0d0d1a; margin-bottom: 25px; }
        h1 { font-family: 'Bebas Neue'; font-size: 50px; margin: 0; letter-spacing: 5px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 20px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 20px; position: relative; border-left: 5px solid #222; }
        .match-meta { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-bottom: 10px; }
        .vs-box { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .team { flex: 1.2; text-align: center; font-weight: 700; font-size: 17px; }
        .score-box { flex: 1; text-align: center; }
        .main-score { font-family: 'Bebas Neue'; font-size: 60px; color: #fff; line-height: 1; }
        .iy-score { font-size: 12px; color: var(--red); font-weight: 700; margin-top: 5px; }
        .stat-badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 10px 0; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 12px; }
        .badge { text-align: center; }
        .badge small { display: block; font-size: 8px; color: var(--muted); text-transform: uppercase; }
        .badge b { font-size: 11px; color: var(--blue); }
        .absents-info { font-size: 10px; padding: 10px; background: rgba(255,62,62,0.05); border-radius: 10px; margin-bottom: 15px; border-left: 2px solid var(--red); }
        .analysis-results { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .a-box { background: rgba(255,255,255,0.02); padding: 12px; border-radius: 15px; text-align: center; border: 1px solid var(--border); }
        .a-box span { display: block; font-size: 10px; color: var(--muted); margin-bottom: 3px; }
        .a-box b { font-size: 18px; font-family: 'Bebas Neue'; color: var(--green); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ULTRA ANALYST V19</h1>
        <div style="color:var(--green); font-weight:700; font-size:12px; letter-spacing:1px;">MAÇKOLİK DEEP STATS • VERİMLİLİK ODAKLI SKOR MOTORU</div>
    </header>
    <div id="app" class="grid"></div>
</div>

<script>
/**
 * MAÇKOLİK İSTATİSTİK SAYFASI (GÜNCEL VERİLER)
 * conversion: Gol/Şut Verimliliği | bigChance: Kaçan Büyük Şans
 * passAcc: Pas İsabeti | airDuel: Hava Topu Hakimiyeti
 */
const TEAMS = {
    "Galatasaray": { att: 2.2, def: 0.8, form: 1.12, mot: 1.05, elo: 1870, conversion: 0.14, bigChance: 2.8, passAcc: 84, airDuel: 52, absImpact: 0.15 },
    "Fenerbahçe": { att: 2.1, def: 0.9, form: 0.85, mot: 1.15, elo: 1840, conversion: 0.12, bigChance: 3.1, passAcc: 82, airDuel: 50, absImpact: 0.12 },
    "Trabzonspor": { att: 1.7, def: 1.1, form: 1.10, mot: 1.10, elo: 1760, conversion: 0.11, bigChance: 1.8, passAcc: 78, airDuel: 55, absImpact: 0.10 },
    "Beşiktaş": { att: 1.6, def: 1.1, form: 1.05, mot: 1.00, elo: 1740, conversion: 0.10, bigChance: 2.1, passAcc: 80, airDuel: 48, absImpact: 0.12 },
    "Göztepe": { att: 1.5, def: 1.0, form: 1.10, mot: 1.10, elo: 1700, conversion: 0.15, bigChance: 1.5, passAcc: 74, airDuel: 54, absImpact: 0.05 },
    "Başakşehir": { att: 1.6, def: 1.2, form: 1.00, mot: 1.00, elo: 1710, conversion: 0.10, bigChance: 1.9, passAcc: 83, airDuel: 46, absImpact: 0.05 },
    "Samsunspor": { att: 1.4, def: 1.3, form: 1.05, mot: 1.05, elo: 1625, conversion: 0.11, bigChance: 1.6, passAcc: 72, airDuel: 51, absImpact: 0.05 },
    "Kayserispor": { att: 1.1, def: 1.7, form: 0.82, mot: 1.30, elo: 1495, conversion: 0.08, bigChance: 1.2, passAcc: 75, airDuel: 49, absImpact: 0.05 },
    "Kasımpaşa": { att: 1.4, def: 1.6, form: 0.95, mot: 1.10, elo: 1515, conversion: 0.13, bigChance: 2.0, passAcc: 76, airDuel: 45, absImpact: 0.05 },
    "Eyüpspor": { att: 1.2, def: 1.5, form: 0.90, mot: 1.15, elo: 1520, conversion: 0.11, bigChance: 1.4, passAcc: 79, airDuel: 47, absImpact: 0.05 },
    "Gençlerbirliği": { att: 1.1, def: 1.4, form: 1.02, mot: 1.05, elo: 1555, conversion: 0.09, bigChance: 1.1, passAcc: 77, airDuel: 53, absImpact: 0.05 },
    "Alanyaspor": { att: 1.2, def: 1.5, form: 0.90, mot: 1.00, elo: 1540, conversion: 0.10, bigChance: 1.3, passAcc: 81, airDuel: 48, absImpact: 0.05 },
    "Ç. Rizespor": { att: 1.3, def: 1.7, form: 0.90, mot: 1.10, elo: 1560, conversion: 0.10, bigChance: 1.5, passAcc: 75, airDuel: 52, absImpact: 0.05 },
    "Antalyaspor": { att: 1.2, def: 1.6, form: 0.85, mot: 1.00, elo: 1530, conversion: 0.09, bigChance: 1.7, passAcc: 78, airDuel: 49, absImpact: 0.05 },
    "Gaziantep FK": { att: 1.3, def: 1.7, form: 1.10, mot: 1.15, elo: 1570, conversion: 0.12, bigChance: 1.6, passAcc: 73, airDuel: 51, absImpact: 0.05 },
    "Kocaelispor": { att: 1.3, def: 1.3, form: 0.95, mot: 1.00, elo: 1580, conversion: 0.11, bigChance: 1.8, passAcc: 76, airDuel: 54, absImpact: 0.05 },
    "Konyaspor": { att: 1.2, def: 1.5, form: 1.05, mot: 1.15, elo: 1530, conversion: 0.10, bigChance: 1.5, passAcc: 74, airDuel: 50, absImpact: 0.05 },
    "Karagümrük": { att: 1.1, def: 1.8, form: 1.15, mot: 1.25, elo: 1500, conversion: 0.11, bigChance: 1.3, passAcc: 75, airDuel: 52, absImpact: 0.05 }
};

const FIXTURES = [
    { h: "Galatasaray", a: "Başakşehir", odds: [1.42, 4.10, 5.40], hAbs: "Muslera", aAbs: "Yok" },
    { h: "Trabzonspor", a: "Ç. Rizespor", odds: [1.65, 3.60, 3.90], hAbs: "Visca", aAbs: "Shelvey" },
    { h: "Göztepe", a: "Alanyaspor", odds: [1.90, 3.25, 3.10], hAbs: "Yok", aAbs: "Yok" },
    { h: "Samsunspor", a: "Kayserispor", odds: [2.10, 3.10, 2.85], hAbs: "Yok", aAbs: "Yok" },
    { h: "Kasımpaşa", a: "Eyüpspor", odds: [2.25, 3.20, 2.55], hAbs: "Yok", aAbs: "Yok" },
    { h: "Gençlerbirliği", a: "Beşiktaş", odds: [4.80, 3.90, 1.45], hAbs: "Yok", aAbs: "Aboubakar" },
    { h: "Antalyaspor", a: "Gaziantep FK", odds: [2.05, 3.15, 2.95], hAbs: "Yok", aAbs: "Yok" },
    { h: "Kocaelispor", a: "Konyaspor", odds: [2.40, 3.10, 2.60], hAbs: "Yok", aAbs: "Yok" },
    { h: "Karagümrük", a: "Fenerbahçe", odds: [5.20, 4.10, 1.40], hAbs: "Yok", aAbs: "Fred" }
];

function fact(n) { return n <= 1 ? 1 : n * fact(n-1); }
function pois(k, l) { return (Math.pow(l, k) * Math.exp(-l)) / fact(k); }

function run() {
    const app = document.getElementById("app");
    FIXTURES.forEach(m => {
        const H = TEAMS[m.h]; const A = TEAMS[m.a];
        
        // VERİMLİLİK ODAKLI xG HESABI
        let hStatMod = (H.conversion * 6) + (H.passAcc / 100) + (H.bigChance * 0.05);
        let aStatMod = (A.conversion * 6) + (A.passAcc / 100) + (A.bigChance * 0.05);

        let hXG = (H.att * A.def * H.form * H.mot * hStatMod / 2) * (1 + (H.elo - A.elo)/700) + 0.12;
        let aXG = (A.att * H.def * A.form * A.mot * aStatMod / 2) * (1 - (H.elo - A.elo)/700);
        
        // Eksik Etkisi
        if(m.hAbs !== "Yok") hXG -= H.absImpact; if(m.aAbs !== "Yok") aXG -= A.absImpact;
        hXG = Math.max(0.2, hXG); aXG = Math.max(0.1, aXG);

        let pW = 0, pD = 0, pL = 0, btts = 0, o25 = 0, maxP = 0, score = "0-0";
        for (let i = 0; i < 6; i++) {
            for (let j = 0; j < 6; j++) {
                let prob = pois(i, hXG) * pois(j, aXG);
                if (i < 2 && j < 2) prob *= 1.25; // Dixon-Coles Reel Skor Baskısı
                if (i > j) pW += prob; else if (i === j) pD += prob; else pL += prob;
                if (i + j > 2.5) o25 += prob;
                if (i > 0 && j > 0) btts += prob;
                if (prob > maxP) { maxP = prob; score = i + "-" + j; }
            }
        }

        app.innerHTML += `
            <div class="card">
                <div class="match-meta"><span>IDDAA: ${m.odds[0]}/${m.odds[1]}/${m.odds[2]}</span> <span>ELO DIFF: ${Math.abs(H.elo-A.elo)}</span></div>
                <div class="vs-box">
                    <div class="team">${m.h}</div>
                    <div class="score-box"><span class="main-score">${score}</span><span class="iy-score">İY TAHMİN: ${Math.floor(hXG*0.35)}-${Math.floor(aXG*0.35)}</span></div>
                    <div class="team">${m.a}</div>
                </div>
                <div class="stat-badges">
                    <div class="badge"><small>VERİMLİLİK</small><b>%${(H.conversion*100).toFixed(0)}</b></div>
                    <div class="badge"><small>PAS İSABET</small><b>%${H.passAcc}</b></div>
                    <div class="badge"><small>B.ŞANS</small><b>${H.bigChance}</b></div>
                    <div class="badge"><small>HAVA T.</small><b>%${H.airDuel}</b></div>
                </div>
                <div class="absents-info"><b>EKSİKLER:</b> ${m.h}: ${m.hAbs} | ${m.a}: ${m.aAbs}</div>
                <div class="analysis-results">
                    <div class="a-box"><span>EV KAZANIR</span><b>%${(pW*100).toFixed(0)}</b></div>
                    <div class="a-box"><span>KG VAR</span><b>%${(btts*100).toFixed(0)}</b></div>
                    <div class="a-box"><span>2.5 ÜST</span><b>%${(o25*100).toFixed(0)}</b></div>
                    <div class="a-box"><span>BEKLENEN xG</span><b>${hXG.toFixed(1)}-${aXG.toFixed(1)}</b></div>
                </div>
            </div>`;
    });
}
run();
</script>
</body>
</html>
