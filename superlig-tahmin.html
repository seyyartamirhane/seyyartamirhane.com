<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ULTRA ANALYST V16 | Kaos Çarpanı Entegre</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --red: #ff3e3e; --bg: #05050a; --surface: #0f0f1a; --border: rgba(255,255,255,0.1); --text: #f0f0f5; --green: #00ff88; --orange: #ff9f43; }
        body { font-family: 'Outfit'; background: var(--bg); color: var(--text); padding: 20px; }
        .wrap { max-width: 1200px; margin: auto; }
        header { text-align: center; padding: 20px; border-bottom: 3px solid var(--red); margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px; position: relative; overflow: hidden; }
        .chaos-alert { position: absolute; top: 0; right: 0; background: var(--orange); color: #000; font-size: 9px; font-weight: 900; padding: 4px 10px; border-radius: 0 0 0 10px; text-transform: uppercase; }
        .vs { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; }
        .team { flex: 1; text-align: center; font-weight: 700; }
        .main-score { font-family: 'Bebas Neue'; font-size: 50px; color: var(--red); line-height: 1; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
        .stat-box { background: rgba(255,255,255,0.03); padding: 8px; border-radius: 10px; text-align: center; border: 1px solid #222; }
        .stat-box small { display: block; font-size: 10px; color: #777; }
        .stat-box b { color: var(--green); font-size: 16px; font-family: 'Bebas Neue'; }
        .tag { font-size: 9px; padding: 3px 6px; background: #111; border-radius: 4px; color: #888; border: 1px solid #333; }
    </style>
</head>
<body>

<div class="wrap">
    <header>
        <h1 style="font-family:'Bebas Neue'; font-size:50px; margin:0;">ULTRA ANALYST V16</h1>
        <p style="color:var(--orange); font-weight:700; margin:5px 0;">CHAOS ENGINE & ENTROPY MODEL ACTIVE</p>
    </header>
    <div id="grid" class="grid"></div>
</div>

<script>
const TEAMS = {
    "Galatasaray": { elo: 1865, att: 2.65, def: 0.75, form: 1.15, motivation: 1.0 },
    "Fenerbahçe": { elo: 1850, att: 2.45, def: 0.85, form: 1.12, motivation: 1.0 },
    "Beşiktaş": { elo: 1745, att: 1.95, def: 1.10, form: 1.05, motivation: 1.0 },
    "Trabzonspor": { elo: 1755, att: 1.80, def: 1.15, form: 0.95, motivation: 1.1 }, // Derbi hırsı
    "Başakşehir FK": { elo: 1700, att: 1.65, def: 1.20, form: 1.02, motivation: 1.0 },
    "Göztepe": { elo: 1690, att: 1.60, def: 1.05, form: 1.10, motivation: 1.05 },
    "Samsunspor": { elo: 1620, att: 1.45, def: 1.25, form: 1.05, motivation: 1.0 },
    "Kocaelispor": { elo: 1585, att: 1.40, def: 1.30, form: 1.00, motivation: 1.0 },
    "Eyüpspor": { elo: 1530, att: 1.30, def: 1.40, form: 0.92, motivation: 1.0 },
    "Gençlerbirliği": { elo: 1555, att: 1.25, def: 1.45, form: 1.04, motivation: 1.0 },
    "Alanyaspor": { elo: 1545, att: 1.25, def: 1.55, form: 0.93, motivation: 1.0 },
    "Antalyaspor": { elo: 1535, att: 1.20, def: 1.65, form: 0.88, motivation: 1.0 },
    "Kasımpaşa": { elo: 1515, att: 1.50, def: 1.75, form: 1.02, motivation: 1.0 },
    "Çaykur Rizespor": { elo: 1560, att: 1.35, def: 1.65, form: 0.90, motivation: 1.1 }, // Derbi hırsı
    "Gaziantep FK": { elo: 1570, att: 1.30, def: 1.80, form: 1.00, motivation: 1.15 }, // Düşme hattı direnci
    "Kayserispor": { elo: 1500, att: 1.05, def: 1.90, form: 0.82, motivation: 1.20 }, // Can havli
    "Konyaspor": { elo: 1525, att: 1.20, def: 1.50, form: 0.96, motivation: 1.1 },
    "Fatih Karagümrük": { elo: 1490, att: 1.15, def: 1.85, form: 0.92, motivation: 1.20 }
};

const FIXTURES = [
    { h: "Galatasaray", a: "Başakşehir FK", chaos: 0.05 },
    { h: "Fatih Karagümrük", a: "Fenerbahçe", chaos: 0.25 }, // Yüksek kaos (Düşme hattı)
    { h: "Trabzonspor", a: "Çaykur Rizespor", chaos: 0.30 }, // Bölgesel derbi kaosu
    { h: "Gençlerbirliği", a: "Beşiktaş", chaos: 0.10 },
    { h: "Göztepe", a: "Alanyaspor", chaos: 0.08 },
    { h: "Samsunspor", a: "Kayserispor", chaos: 0.20 },
    { h: "Kocaelispor", a: "Konyaspor", chaos: 0.15 },
    { h: "Antalyaspor", a: "Gaziantep FK", chaos: 0.18 },
    { h: "Kasımpaşa", a: "Eyüpspor", chaos: 0.05 }
];

function fact(n) { return n <= 1 ? 1 : n * fact(n-1); }
function pois(k, l) { return (Math.pow(l, k) * Math.exp(-l)) / fact(k); }

function run() {
    const grid = document.getElementById("grid");
    FIXTURES.forEach(m => {
        const H = TEAMS[m.h]; const A = TEAMS[m.a];
        
        // Kaos çarpanı xG sapmalarını tetikler
        let hXG = (H.att * A.def * H.form * H.motivation) * (1 + (H.elo - A.elo)/500) + 0.25;
        let aXG = (A.att * H.def * A.form * A.motivation) * (1 - (H.elo - A.elo)/500);

        let pW = 0, pD = 0, pL = 0, btts = 0, o25 = 0, maxP = 0, bestS = "0-0";
        for (let i = 0; i < 7; i++) {
            for (let j = 0; j < 7; j++) {
                let prob = pois(i, hXG) * pois(j, aXG);
                // Dixon-Coles benzeri düşük skor düzeltmesi (Kaosla modifiye edilmiş)
                if (i < 2 && j < 2) prob *= (1 - m.chaos); 
                
                if (i > j) pW += prob; else if (i === j) pD += prob; else pL += prob;
                if (i + j > 2.5) o25 += prob;
                if (i > 0 && j > 0) btts += prob;
                if (prob > maxP) { maxP = prob; bestS = i + "-" + j; }
            }
        }

        grid.innerHTML += `
            <div class="card">
                ${m.chaos > 0.15 ? '<div class="chaos-alert">Yüksek Kaos Riski</div>' : ''}
                <div class="vs">
                    <div class="team">${m.h}</div>
                    <div class="main-score">${bestS}</div>
                    <div class="team">${m.a}</div>
                </div>
                <div class="stats">
                    <div class="stat-box"><small>KAOS ETKİSİ</small><b>%${(m.chaos*100).toFixed(0)}</b></div>
                    <div class="stat-box"><small>KG VAR</small><b>%${(btts*100).toFixed(0)}</b></div>
                    <div class="stat-box"><small>SÜRPRİZ OLASILIĞI</small><b>%${(Math.min(pW, pL)*100 + m.chaos*50).toFixed(0)}</b></div>
                    <div class="stat-box"><small>HEDEF xG</small><b>${hXG.toFixed(1)}-${aXG.toFixed(1)}</b></div>
                </div>
                <div style="margin-top:10px; display:flex; gap:5px;">
                    <span class="tag">Motivasyon: ${Math.max(H.motivation, A.motivation).toFixed(2)}</span>
                    <span class="tag">Dixon-Coles: Aktif</span>
                </div>
            </div>`;
    });
}
run();
</script>
</body>
</html>
